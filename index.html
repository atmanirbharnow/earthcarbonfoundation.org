<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Carbon Foundation | Sovereign Environmental Data Registry</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for In-Browser JSX Compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#f8f9ff] text-[#0b1c30] antialiased min-h-screen flex flex-col justify-between font-sans selection:bg-[#6cf8bb] selection:text-[#00714d]">

    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [currentScreen, setCurrentScreen] = React.useState('welcome');
            const [copied, setCopied] = React.useState(false);
            const [generatedId] = React.useState('ECF-2026-412');
            const [paymentRail, setPaymentRail] = React.useState('upi');
            const [adminAuth, setAdminAuth] = React.useState(false);
            const [adminPass, setAdminPass] = React.useState('');

            const sectoralScopes = {
                "Scope 1: Energy Industries": [
                    "Electricity generation and supply",
                    "Displacement of more-GHG-intensive output",
                    "Renewable energy (Solar, Wind, Hydro)",
                    "Low carbon electricity",
                    "Energy efficiency",
                    "Fuel/feedstock switch",
                    "Energy for industries"
                ],
                "Scope 2: Energy Distribution": [
                    "Grid loss reduction",
                    "Transmission efficiency"
                ],
                "Scope 3: Energy Demand": [
                    "Building energy efficiency",
                    "Industrial process optimization",
                    "Appliance and lighting retrofits"
                ],
                "Scope 7: Transport": [
                    "Bus rapid transit (BRT) systems",
                    "Electric vehicle (EV) fleets & charging infrastructure",
                    "Rail transport optimization"
                ],
                "Scope 13: Waste Handling and Disposal": [
                    "Landfill gas capture and power generation",
                    "Composting & organic waste valorization",
                    "Wastewater treatment methane destruction"
                ],
                "Scope 14: Afforestation & Reforestation": [
                    "GHG removal by carbon sinks",
                    "Agroforestry & mangrove restoration"
                ],
                "Scope 15: Agriculture": [
                    "Soil organic carbon sequestration & biochar",
                    "GHG emission avoidance via livestock management",
                    "Alternate wetting and drying (AWD) in paddy cultivation"
                ]
            };

            const [form2A, setForm2A] = React.useState({
                scope: 'Scope 1: Energy Industries',
                subCategory: 'Renewable energy (Solar, Wind, Hydro)',
                role: 'Farmer / Producer',
                state: 'Gujarat',
                district: 'Ahmedabad',
                projectSize: '',
                contactName: '',
                contactEmail: '',
                contactPhone: ''
            });

            const [form2B, setForm2B] = React.useState({
                orgName: '',
                selectedScopes: [],
                participantCount: '',
                geography: '',
                contactPerson: '',
                contactEmail: '',
                contactPhone: ''
            });

            const [poaCohorts] = React.useState([
                { id: 'POA-SOLAR-01', title: 'Gujarat Decentralized Solar Grid PoA', capacityFilled: 82, targetKw: '50 MW', lead: 'Earth Carbon Foundation' },
                { id: 'POA-AGRI-02', title: 'North India Soil Sequestration & Biochar', capacityFilled: 64, targetKw: '25,000 Tons', lead: 'AgriCarbon Alliance' },
                { id: 'POA-EV-03', title: 'Pan-India Electric Fleet & Charging Hub', capacityFilled: 91, targetKw: '10,000 EVs', lead: 'GreenLogistics India' }
            ]);

            const [errors, setErrors] = React.useState({});

            const handleScopeToggle = (scopeKey) => {
                setForm2B(prev => ({
                    ...prev,
                    selectedScopes: prev.selectedScopes.includes(scopeKey)
                        ? prev.selectedScopes.filter(s => s !== scopeKey)
                        : [...prev.selectedScopes, scopeKey]
                }));
            };

            const validateForm2A = () => {
                const newErrors = {};
                if (!form2A.projectSize) newErrors.projectSize = 'Project size is required';
                if (!form2A.contactName) newErrors.contactName = 'Name is required';
                if (!form2A.contactEmail || !form2A.contactEmail.includes('@')) newErrors.contactEmail = 'Valid email is required';
                if (!form2A.contactPhone) newErrors.contactPhone = 'Phone number is required';
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            const validateForm2B = () => {
                const newErrors = {};
                if (!form2B.orgName) newErrors.orgName = 'Organization name is required';
                if (form2B.selectedScopes.length === 0) newErrors.selectedScopes = 'Select at least one sectoral scope';
                if (!form2B.participantCount) newErrors.participantCount = 'Participant count is required';
                if (!form2B.geography) newErrors.geography = 'Geography is required';
                if (!form2B.contactPerson) newErrors.contactPerson = 'Contact person is required';
                if (!form2B.contactEmail || !form2B.contactEmail.includes('@')) newErrors.contactEmail = 'Valid email is required';
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            const handleCopyText = (text) => {
                navigator.clipboard.writeText(text);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    {/* Header */}
                    <header className="bg-white border-b border-[#c2c8c4]/40 sticky top-0 z-50 shadow-xs">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
                            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setCurrentScreen('welcome')}>
                                <div className="w-10 h-10 rounded-lg bg-[#0f241d] text-[#6ffbbe] flex items-center justify-center font-bold">
                                    <span className="material-symbols-outlined text-[24px]">eco</span>
                                </div>
                                <div>
                                    <span className="text-xl font-extrabold tracking-tight text-[#000b07]">Earth Carbon Foundation</span>
                                    <div className="flex items-center space-x-1.5">
                                        <span className="w-2 h-2 rounded-full bg-[#006c49]"></span>
                                        <span className="text-xs text-[#727875] font-mono">Sovereign Environmental Data Registry</span>
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center space-x-3">
                                <button onClick={() => setCurrentScreen('pathways')} className="text-xs font-semibold bg-[#eff4ff] text-[#006c49] border border-[#006c49]/30 px-4 py-2.5 rounded-lg hover:bg-[#e2edff] transition-all cursor-pointer">
                                    Explore PoA Portfolios
                                </button>
                                <button onClick={() => setCurrentScreen('admin')} className="text-xs font-semibold bg-[#0f241d] text-[#6ffbbe] px-4 py-2.5 rounded-lg hover:bg-black transition-all cursor-pointer">
                                    Admin Portal
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 max-w-6xl w-full mx-auto px-6 py-10 flex flex-col justify-center">

                        {currentScreen === 'welcome' && (
                            <div className="max-w-2xl mx-auto text-center space-y-8 bg-white border border-[#c2c8c4]/60 rounded-3xl p-10 sm:p-14 shadow-sm">
                                <div className="w-20 h-20 mx-auto rounded-2xl bg-[#0f241d] text-[#6ffbbe] flex items-center justify-center shadow-md">
                                    <span className="material-symbols-outlined text-[40px]">eco</span>
                                </div>
                                <div className="space-y-4">
                                    <span className="px-3 py-1 rounded-full text-xs font-bold bg-[#eff4ff] text-[#006c49] border border-[#c2c8c4]/40">
                                        Environmental Registry Protocol
                                    </span>
                                    <h1 className="text-3xl sm:text-5xl font-extrabold text-[#000b07] tracking-tight">
                                        Welcome to Earth Carbon Foundation
                                    </h1>
                                    <div className="py-2 space-y-2">
                                        <p className="text-xl font-semibold text-[#006c49] italic">"The World Is One Family"</p>
                                        <p className="text-xs text-[#727875] font-mono uppercase tracking-widest">— Vasudhaiva Kutumbakam —</p>
                                    </div>
                                </div>
                                <div className="pt-4 flex justify-center">
                                    <button onClick={() => setCurrentScreen('pathways')} className="px-8 h-14 bg-[#0f241d] hover:bg-black text-white font-bold rounded-xl text-base flex items-center justify-center gap-2 shadow-md transition-all cursor-pointer">
                                        <span>Enter Registry & PoA Portfolios</span>
                                        <span className="material-symbols-outlined text-[18px]">arrow_forward</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {currentScreen === 'pathways' && (
                            <div className="space-y-12">
                                <div className="text-center space-y-4 max-w-3xl mx-auto">
                                    <span className="px-3 py-1 rounded-full text-xs font-bold bg-[#eff4ff] text-[#006c49] border border-[#c2c8c4]/40">Global Climate Asset Registry & PoA Platform</span>
                                    <h1 className="text-3xl sm:text-5xl font-extrabold text-[#000b07] tracking-tight">Monetize Your Low-Carbon Actions with Institutional Rigor</h1>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div onClick={() => setCurrentScreen('form-2a')} className="group bg-white border-2 border-[#c2c8c4]/60 hover:border-[#006c49] rounded-3xl p-8 shadow-sm transition-all duration-300 cursor-pointer flex flex-col justify-between">
                                        <div className="space-y-6">
                                            <div className="w-12 h-12 rounded-2xl bg-[#0f241d] text-[#6ffbbe] flex items-center justify-center">
                                                <span className="material-symbols-outlined text-[24px]">agriculture</span>
                                            </div>
                                            <div className="space-y-2">
                                                <span className="text-xs font-mono uppercase tracking-wider text-[#006c49] font-bold">Option A • Smallholders & Single Assets</span>
                                                <h2 className="text-2xl font-extrabold text-[#000b07]">Join an Existing Programme</h2>
                                                <p className="text-xs sm:text-sm text-[#424845]">Plug into active baseline frameworks with zero upfront screening fees.</p>
                                            </div>
                                        </div>
                                        <div className="pt-8"><button className="w-full h-12 bg-[#0f241d] group-hover:bg-[#006c49] text-white font-bold rounded-xl text-xs">Proceed to Form 2A</button></div>
                                    </div>

                                    <div onClick={() => setCurrentScreen('form-2b')} className="group bg-white border-2 border-[#c2c8c4]/60 hover:border-[#006c49] rounded-3xl p-8 shadow-sm transition-all duration-300 cursor-pointer flex flex-col justify-between">
                                        <div className="space-y-6">
                                            <div className="w-12 h-12 rounded-2xl bg-[#0f241d] text-[#6ffbbe] flex items-center justify-center">
                                                <span className="material-symbols-outlined text-[24px]">domain</span>
                                            </div>
                                            <div className="space-y-2">
                                                <span className="text-xs font-mono uppercase tracking-wider text-[#006c49] font-bold">Option B • EPCs & Developers</span>
                                                <h2 className="text-2xl font-extrabold text-[#000b07]">Propose a Bundled Programme</h2>
                                                <p className="text-xs sm:text-sm text-[#424845]">Structure and register large-scale multi-site carbon portfolios.</p>
                                            </div>
                                        </div>
                                        <div className="pt-8"><button className="w-full h-12 bg-[#0f241d] group-hover:bg-[#006c49] text-white font-bold rounded-xl text-xs">Proceed to Form 2B</button></div>
                                    </div>
                                </div>

                                <div className="space-y-6 pt-6">
                                    <div className="border-b border-[#c2c8c4]/40 pb-3 flex justify-between items-center">
                                        <div>
                                            <h2 className="text-xl font-extrabold text-[#000b07]">Active Waitlisted PoA Cohorts</h2>
                                            <p className="text-xs text-[#727875]">Real-time capacity and saturation indicators.</p>
                                        </div>
                                        <span className="px-3 py-1 rounded-full text-xs font-mono bg-[#006c49]/15 text-[#006c49] font-bold">Live Feed</span>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        {poaCohorts.map((poa) => (
                                            <div key={poa.id} className="bg-white border border-[#c2c8c4]/60 rounded-2xl p-6 shadow-xs space-y-4">
                                                <div className="flex justify-between items-start">
                                                    <span className="text-[10px] font-mono bg-[#eff4ff] text-[#006c49] px-2.5 py-1 rounded font-bold">{poa.id}</span>
                                                    <span className="text-xs font-bold text-[#727875]">{poa.targetKw}</span>
                                                </div>
                                                <div>
                                                    <h3 className="text-base font-bold text-[#000b07]">{poa.title}</h3>
                                                    <p className="text-xs text-[#727875] mt-0.5">Lead: {poa.lead}</p>
                                                </div>
                                                <div className="space-y-1.5 pt-2">
                                                    <div className="flex justify-between text-xs font-bold">
                                                        <span className="text-[#727875]">Cohort Saturation</span>
                                                        <span className="text-[#006c49]">{poa.capacityFilled}% Filled</span>
                                                    </div>
                                                    <div className="w-full h-3 bg-[#e5eeff] rounded-full overflow-hidden p-0.5 border border-[#c2c8c4]/30">
                                                        <div className="h-full bg-gradient-to-r from-[#006c49] to-[#6cf8bb] rounded-full" style={{ width: `${poa.capacityFilled}%` }}></div>
                                                    </div>
                                                </div>
                                                <button onClick={() => setCurrentScreen('form-2a')} className="w-full h-10 bg-[#eff4ff] hover:bg-[#0f241d] hover:text-white text-[#000b07] font-bold rounded-xl text-xs border border-[#c2c8c4]/40 cursor-pointer">Lock Slot in PoA →</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {currentScreen === 'form-2a' && (
                            <div className="bg-white border border-[#c2c8c4]/60 rounded-3xl p-8 sm:p-10 shadow-sm space-y-8 max-w-3xl mx-auto w-full">
                                <div className="flex justify-between items-center border-b border-[#c2c8c4]/30 pb-4">
                                    <div>
                                        <span className="text-xs font-mono text-[#006c49] font-bold uppercase">Form 2A • UNFCCC Scope Selection</span>
                                        <h1 className="text-2xl font-extrabold text-[#000b07]">Join Existing Programme (PoA)</h1>
                                    </div>
                                    <button onClick={() => setCurrentScreen('pathways')} className="text-xs font-bold text-[#006c49] flex items-center gap-1 cursor-pointer">Back</button>
                                </div>

                                <form onSubmit={(e) => { e.preventDefault(); if(validateForm2A()) setCurrentScreen('payment'); }} className="space-y-6">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-[#000b07] uppercase">1. UNFCCC Sectoral Scope</label>
                                            <select value={form2A.scope} onChange={(e) => {
                                                const newScope = e.target.value;
                                                setForm2A({...form2A, scope: newScope, subCategory: sectoralScopes[newScope][0]});
                                            }} className="w-full h-11 px-3 bg-[#f8f9ff] border border-[#c2c8c4] rounded-xl text-xs font-medium outline-none">
                                                {Object.keys(sectoralScopes).map((scopeKey) => (
                                                    <option key={scopeKey} value={scopeKey}>{scopeKey}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-[#000b07] uppercase">2. Activity Sub-Category</label>
                                            <select value={form2A.subCategory} onChange={(e) => setForm2A({...form2A, subCategory: e.target.value})} className="w-full h-11 px-3 bg-[#f8f9ff] border border-[#c2c8c4] rounded-xl text-xs font-medium outline-none">
                                                {sectoralScopes[form2A.scope]?.map((sub) => (
                                                    <option key={sub} value={sub}>{sub}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-[#000b07] uppercase">3. Stakeholder Role</label>
                                            <select value={form2A.role} onChange={(e) => setForm2A({...form2A, role: e.target.value})} className="w-full h-11 px-3 bg-[#f8f9ff] border border-[#c2c8c4] rounded-xl text-xs font-medium outline-none">
                                                <option value="Farmer / Producer">Farmer / Producer</option>
                                                <option value="Cooperative Head">Cooperative Head</option>
                                                <option value="Small Business Owner">Small Business Owner</option>
                                            </select>
                                        </div>

                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-[#000b07] uppercase">4. Project Size / Capacity</label>
                                            <input type="text" placeholder="e.g. 50 kW or tons" value={form2A.projectSize} onChange={(e) => setForm2A({...form2A, projectSize: e.target.value})} className="w-full h-11 px-3 bg-[#f8f9ff] border border-[#c2c8c4] rounded-xl text-sm outline-none" />
                                            {errors.projectSize && <span className="text-[10px] text-red-600 font-bold">{errors.projectSize}</span>}
                                        </div>
                                    </div>

                                    <div className="border-t border-[#c2c8c4]/30 pt-4 space-y-4">
                                        <h3 className="text-xs font-bold uppercase text-[#727875]">Contact & Verification Details</h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                            <input type="text" placeholder="Full Name" value={form2A.contactName} onChange={(e) => setForm2A({...form2A, contactName: e.target.value})} className="w-full h-11 px-3 bg-[#f8f9ff] border border-[#c2c8c4] rounded-xl text-xs" />
                                            <input type="email" placeholder="Email Address" value={form2A.contactEmail} onChange={(e) => setForm2A({...form2A, contactEmail: e.target.value})} className="w-full h-11 px-3 bg-[#f8f9ff] border border-[#c2c8c4] rounded-xl text-xs" />
                                            <input type="text" placeholder="Phone Number" value={form2A.contactPhone} onChange={(e) => setForm2A({...form2A, contactPhone: e.target.value})} className="w-full h-11 px-3 bg-[#f8f9ff] border border-[#c2c8c4] rounded-xl text-xs" />
                                        </div>
                                    </div>

                                    <button type="submit" className="w-full h-14 bg-[#0f241d] hover:bg-black text-white font-bold rounded-xl text-sm cursor-pointer shadow-md">Proceed to Secure Booking (₹2,100) →</button>
                                </form>
                            </div>
                        )}

                        {currentScreen === 'form-2b' && (
                            <div className="bg-white border border-[#c2c8c4]/60 rounded-3xl p-8 sm:p-10 shadow-sm space-y-8 max-w-3xl mx-auto w-full">
                                <div className="flex justify-between items-center border-b border-[#c2c8c4]/30 pb-4">
                                    <div>
                                        <span className="text-xs font-mono text-[#006c49] font-bold uppercase">Form 2B • Aggregator Pipeline</span>
                                        <h1 className="text-2xl font-extrabold text-[#000b07]">Propose a Bundled Programme</h1>
                                    </div>
                                    <button onClick={() => setCurrentScreen('pathways')} className="text-xs font-bold text-[#006c49] cursor-pointer">Back</button>
                                </div>

                                <form onSubmit={(e) => { e.preventDefault(); if(validateForm2B()) setCurrentScreen('payment'); }} className="space-y-6">
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-[#000b07] uppercase">Organization Name</label>
                                        <input type="text" placeholder="e.g. Gujarat Solar EPC Ltd." value={form2B.orgName} onChange={(e) => setForm2B({...form2B, orgName: e.target.value})} className="w-full h-11 px-3 bg-[#f8f9ff] border border-[#c2c8c4] rounded-xl text-sm outline-none" />
                                    </div>

                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-[#000b07] uppercase">Target Sectoral Scopes (Multi-select)</label>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                                            {Object.keys(sectoralScopes).map((scopeKey) => (
                                                <button type="button" key={scopeKey} onClick={() => handleScopeToggle(scopeKey)} className={`p-3 rounded-xl border text-xs font-bold transition-all text-left cursor-pointer ${form2B.selectedScopes.includes(scopeKey) ? 'bg-[#006c49] text-white border-[#006c49]' : 'bg-[#f8f9ff] text-[#000b07] border-[#c2c8c4]/60'}`}>
                                                    {scopeKey}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <input type="number" placeholder="Expected Participant Count" value={form2B.participantCount} onChange={(e) => setForm2B({...form2B, participantCount: e.target.value})} className="w-full h-11 px-3 bg-[#f8f9ff] border border-[#c2c8c4] rounded-xl text-xs" />
                                        <input type="text" placeholder="Target Geography / State(s)" value={form2B.geography} onChange={(e) => setForm2B({...form2B, geography: e.target.value})} className="w-full h-11 px-3 bg-[#f8f9ff] border border-[#c2c8c4] rounded-xl text-xs" />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <input type="text" placeholder="Contact Person Name" value={form2B.contactPerson} onChange={(e) => setForm2B({...form2B, contactPerson: e.target.value})} className="w-full h-11 px-3 bg-[#f8f9ff] border border-[#c2c8c4] rounded-xl text-xs" />
                                        <input type="email" placeholder="Corporate Email" value={form2B.contactEmail} onChange={(e) => setForm2B({...form2B, contactEmail: e.target.value})} className="w-full h-11 px-3 bg-[#f8f9ff] border border-[#c2c8c4] rounded-xl text-xs" />
                                        <input type="text" placeholder="Direct Phone" value={form2B.contactPhone} onChange={(e) => setForm2B({...form2B, contactPhone: e.target.value})} className="w-full h-11 px-3 bg-[#f8f9ff] border border-[#c2c8c4] rounded-xl text-xs" />
                                    </div>

                                    <button type="submit" className="w-full h-14 bg-[#0f241d] hover:bg-black text-white font-bold rounded-xl text-sm cursor-pointer shadow-md">Proceed to Secure Booking (₹2,100) →</button>
                                </form>
                            </div>
                        )}

                        {currentScreen === 'payment' && (
                            <div className="max-w-xl mx-auto space-y-6 bg-white border border-[#c2c8c4]/60 rounded-3xl p-8 shadow-sm">
                                <div className="flex justify-between items-center border-b border-[#c2c8c4]/30 pb-4">
                                    <div>
                                        <span className="text-xs font-mono text-[#006c49] font-bold uppercase">Step 3 of 3 • Secure Escrow</span>
                                        <h1 className="text-2xl font-extrabold text-[#000b07]">PoA Space Booking Fee</h1>
                                    </div>
                                    <span className="text-xs font-mono bg-[#6cf8bb]/30 px-2.5 py-1 rounded text-[#00714d] font-bold">256-bit SSL</span>
                                </div>
                                <div className="p-4 bg-[#eff4ff] rounded-2xl border border-[#c2c8c4]/40 flex items-center justify-between">
                                    <span className="text-sm font-bold text-[#000b07]">PoA Cohort Monetisation Booking</span>
                                    <span className="text-xl font-extrabold text-[#006c49]">₹2,100</span>
                                </div>
                                <button onClick={() => setCurrentScreen('success')} className="w-full h-14 bg-[#0f241d] hover:bg-black text-white font-bold rounded-xl text-sm flex items-center justify-center gap-2 cursor-pointer shadow-md">
                                    <span>Pay ₹2,100 & Lock PoA Space</span>
                                </button>
                            </div>
                        )}

                        {currentScreen === 'success' && (
                            <div className="max-w-2xl mx-auto space-y-8 bg-white border border-[#c2c8c4]/60 rounded-3xl p-8 sm:p-10 shadow-sm text-center">
                                <div className="w-16 h-16 mx-auto rounded-full bg-[#006c49] text-white flex items-center justify-center shadow-lg">
                                    <span className="material-symbols-outlined text-3xl">check_circle</span>
                                </div>
                                <h1 className="text-2xl font-extrabold text-[#000b07]">PoA Cohort Space Confirmed!</h1>
                                <div className="bg-[#f8f9ff] border border-[#c2c8c4]/60 rounded-2xl p-5 flex items-center justify-between">
                                    <span className="text-2xl font-extrabold text-[#000b07] font-mono">{generatedId}</span>
                                    <button onClick={() => handleCopyText(generatedId)} className="px-4 py-2 bg-[#0f241d] text-white text-xs font-bold rounded-xl cursor-pointer">Copy ID</button>
                                </div>
                                <button onClick={() => setCurrentScreen('welcome')} className="w-full h-12 bg-[#0f241d] text-white font-bold rounded-xl text-xs cursor-pointer">Return to Registry Home</button>
                            </div>
                        )}

                        {currentScreen === 'admin' && (
                            <div className="max-w-2xl mx-auto space-y-6 bg-white border border-[#c2c8c4]/60 rounded-3xl p-8 shadow-sm">
                                <h1 className="text-2xl font-extrabold text-[#000b07]">Admin Intake Portal</h1>
                                {!adminAuth ? (
                                    <div className="space-y-4 py-6">
                                        <input type="password" placeholder="Enter Admin Password (ecf2026)" value={adminPass} onChange={(e) => setAdminPass(e.target.value)} className="w-full h-12 px-3 bg-[#f8f9ff] border border-[#c2c8c4] rounded-xl text-sm" />
                                        <button onClick={() => { if(adminPass === 'ecf2026') setAdminAuth(true); else alert('Invalid password'); }} className="w-full h-12 bg-[#0f241d] text-white font-bold rounded-xl text-xs cursor-pointer">Authenticate</button>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <div className="p-4 bg-[#eff4ff] rounded-xl border border-[#006c49]/30 flex justify-between items-center">
                                            <div>
                                                <span className="text-xs font-bold text-[#006c49] block">Pending Submission #412</span>
                                                <p className="text-xs text-[#000b07]">Form 2A • Gujarat Solar Cohort • ₹2,100 Paid</p>
                                            </div>
                                            <span className="px-3 py-1 bg-amber-100 text-amber-800 text-[10px] font-bold rounded-full">Awaiting Approval</span>
                                        </div>
                                        <button onClick={() => alert('Application Approved & Synced to Google Sheet Application Tracker!')} className="w-full h-12 bg-[#006c49] text-white font-bold rounded-xl text-xs cursor-pointer">Approve & Issue ID</button>
                                    </div>
                                )}
                            </div>
                        )}

                    </main>

                    <footer className="bg-[#000b07] text-white py-8 px-6 border-t border-[#0f241d]">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center text-xs text-[#727875] gap-4">
                            <p>© 2026 Earth Carbon Foundation. Ahmedabad, Gujarat, India. All rights reserved.</p>
                            <div className="flex gap-6">
                                <span className="hover:text-white cursor-pointer">Registry Master Terms</span>
                                <span className="hover:text-white cursor-pointer">Privacy Framework</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
